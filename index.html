<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF9FB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VINKA" />
    <meta name="description" content="VINKA · Tu próximo match empieza aquí." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>VINKA</title>
    <style>
      /* La barra de estado del iPhone se pinta un tono más oscuro (#F5EFF1); el borde superior parte con ese tono para que no se vea una franja */
      #splash{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#FFF9FB linear-gradient(#F5EFF1,#FFF9FB 160px) no-repeat;transition:opacity .4s ease}
      #splash.out{opacity:0;pointer-events:none}
    </style>
  </head>
  <body>
    <!-- Pantalla de carga: persona con maletín que cruza la pantalla y va dejando las letras de VINKA -->
    <div id="splash" role="status" aria-label="Cargando VINKA"></div>
    <script>
      // La animación sale solo al abrir la app; al moverse dentro (cambiar de empresa, recargar) no se repite
      try { if (sessionStorage.getItem('vinka-splash-seen')) { var s = document.getElementById('splash'); s && s.remove() } else sessionStorage.setItem('vinka-splash-seen', '1') } catch (e) {}
    </script>
    <script src="/splash.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
